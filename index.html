<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A beautiful offline-first web music player with PWA support and Google Drive integration">
  <meta name="theme-color" content="#bb86fc">
  <title>Aesthetic Music Player</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🎵</text></svg>">
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1e1e24, #2a2a36);
      --accent-color: #bb86fc;
      --text-color: #ffffff;
      --error-color: #ff6b6b;
      --success-color: #51cf66;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 1s ease;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .player-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      text-align: center;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 600;
      word-break: break-word;
    }

    h3 {
      margin: 16px 0 8px 0;
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      opacity: 0.8;
    }

    p {
      margin: 0 0 12px 0;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    canvas {
      width: 100%;
      height: 80px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      margin: 16px 0;
    }

    audio {
      width: 100%;
      margin-top: 12px;
      accent-color: var(--accent-color);
    }

    .controls, .mood-selector {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    button {
      background: var(--accent-color);
      border: none;
      color: #000;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(187, 134, 252, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(187, 134, 252, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .drive-btn {
      background: #4285F4;
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
    }

    .drive-btn:hover {
      box-shadow: 0 6px 16px rgba(66, 133, 244, 0.5);
    }

    .drive-btn.connected {
      background: var(--success-color);
      box-shadow: 0 4px 12px rgba(81, 207, 102, 0.3);
    }

    .file-upload-label {
      display: inline-block;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 12px;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .file-upload-label:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    input[type="file"] {
      display: none;
    }

    ul.track-list {
      list-style: none;
      padding: 0;
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
    }

    ul.track-list li {
      padding: 10px 12px;
      margin-bottom: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
      word-break: break-word;
    }

    ul.track-list li:hover {
      background: rgba(187, 134, 252, 0.15);
      border-color: rgba(187, 134, 252, 0.3);
      transform: translateX(4px);
    }

    ul.track-list li.active {
      background: rgba(187, 134, 252, 0.25);
      border-color: var(--accent-color);
      font-weight: 600;
    }

    .track-badge {
      font-size: 0.7rem;
      background: rgba(187, 134, 252, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      white-space: nowrap;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      display: none;
      animation: slideIn 0.3s ease;
    }

    .alert.show {
      display: block;
    }

    .alert.error {
      background: rgba(255, 107, 107, 0.2);
      border: 1px solid var(--error-color);
      color: #ff9999;
    }

    .alert.success {
      background: rgba(81, 207, 102, 0.2);
      border: 1px solid var(--success-color);
      color: #7fdbca;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(187, 134, 252, 0.4);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(187, 134, 252, 0.6);
    }

    @media (max-width: 480px) {
      .player-card {
        padding: 20px;
        margin: 16px;
      }

      h2 {
        font-size: 1.2rem;
      }

      button {
        padding: 8px 12px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div id="alert" class="alert"></div>

    <h2 id="now-playing">🎵 No Track Loaded</h2>
    <p id="artist-info">Upload music to get started</p>

    <canvas id="visualizer" aria-label="Audio frequency visualizer"></canvas>
    <audio id="audio-player" controls crossorigin="anonymous"></audio>

    <div>
      <label for="audio-upload" class="file-upload-label">➕ Upload Local Audio</label>
      <input type="file" id="audio-upload" accept="audio/*" multiple aria-label="Upload audio files">
      <button id="drive-auth-btn" class="drive-btn" aria-label="Connect to Google Drive">☁️ Sync Google Drive</button>
    </div>

    <h3>Mood Ambiance</h3>
    <div class="mood-selector">
      <button onclick="setMood('chill')" aria-label="Set chill mood">Chill</button>
      <button onclick="setMood('energetic')" aria-label="Set energetic mood">Energetic</button>
      <button onclick="setMood('focus')" aria-label="Set focus mood">Focus</button>
    </div>

    <h3>Your Library</h3>
    <ul class="track-list" id="playlist" role="listbox" aria-label="Music playlist"></ul>
  </div>

  <script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const CLIENT_ID = 'YOUR_CLIENT_ID_HERE.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';
    const CACHE_NAME = 'music-player-v1';

    // ============================================
    // UI ELEMENTS
    // ============================================
    const audioPlayer = document.getElementById('audio-player');
    const audioUpload = document.getElementById('audio-upload');
    const nowPlaying = document.getElementById('now-playing');
    const artistInfo = document.getElementById('artist-info');
    const playlistElement = document.getElementById('playlist');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const alertBox = document.getElementById('alert');
    const driveAuthBtn = document.getElementById('drive-auth-btn');

    // ============================================
    // STATE
    // ============================================
    let audioCtx, analyser, source;
    let tokenClient;
    let accessToken = null;
    let currentSongId = null;

    // ============================================
    // DATABASE SETUP (Dexie)
    // ============================================
    const db = new Dexie('MusicPlayerDB');
    db.version(1).stores({
      songs: '++id, name, driveId'
    });

    // ============================================
    // UTILITY: ALERTS
    // ============================================
    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert show ${type}`;
      setTimeout(() => alertBox.classList.remove('show'), 4000);
    }

    // ============================================
    // AUDIO VISUALIZER (Web Audio API)
    // ============================================
    function initVisualizer() {
      if (audioCtx) return; // Prevent duplicate initialization
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        source = audioCtx.createMediaElementSource(audioPlayer);

        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 64;

        drawVisualizer();
      } catch (error) {
        console.error('Visualizer initialization failed:', error);
      }
    }

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      
      if (!analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const barWidth = (canvas.width / bufferLength) * 2;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        ctx.fillStyle = '#bb86fc';
        ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
        x += barWidth;
      }
    }

    audioPlayer.addEventListener('play', () => {
      initVisualizer();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(err => console.error('AudioContext resume failed:', err));
      }
    });

    // ============================================
    // PLAYLIST MANAGEMENT
    // ============================================
    async function loadPlaylist() {
      try {
        playlistElement.innerHTML = '';
        const songs = await db.songs.toArray();

        if (songs.length === 0) {
          const emptyMsg = document.createElement('li');
          emptyMsg.textContent = 'No tracks yet. Upload or sync to get started!';
          emptyMsg.style.opacity = '0.6';
          playlistElement.appendChild(emptyMsg);
          return;
        }

        songs.forEach((song) => {
          const li = document.createElement('li');
          li.role = 'option';
          li.setAttribute('data-song-id', song.id);
          if (currentSongId === song.id) li.classList.add('active');

          const nameSpan = document.createElement('span');
          nameSpan.textContent = song.name;

          const badge = document.createElement('span');
          badge.className = 'track-badge';
          badge.textContent = song.blob ? '💾' : '☁️';
          badge.title = song.blob ? 'Cached locally' : 'From Google Drive';

          li.appendChild(nameSpan);
          li.appendChild(badge);
          li.addEventListener('click', () => playSong(song));
          li.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' || e.key === ' ') playSong(song);
          });

          playlistElement.appendChild(li);
        });
      } catch (error) {
        console.error('Failed to load playlist:', error);
        showAlert('Failed to load playlist', 'error');
      }
    }

    async function playSong(song) {
      try {
        if (song.blob) {
          // Local/Cached playback
          audioPlayer.src = URL.createObjectURL(song.blob);
          nowPlaying.innerText = song.name;
          artistInfo.innerText = 'Local playback';
        } else if (song.driveId && accessToken) {
          // Fetch from Google Drive
          nowPlaying.innerText = song.name;
          artistInfo.innerText = 'Loading from Drive...';
          
          const blob = await fetchDriveAudioBlob(song.driveId);
          
          // Cache locally for offline access
          await db.songs.update(song.id, { blob });
          
          audioPlayer.src = URL.createObjectURL(blob);
          artistInfo.innerText = 'Cached - ready offline';
        } else if (song.driveId && !accessToken) {
          showAlert('Connect Google Drive to stream this track', 'error');
          return;
        }

        currentSongId = song.id;
        audioPlayer.play().catch(err => console.error('Playback failed:', err));
        updateActiveTrack();
      } catch (error) {
        console.error('Playback error:', error);
        showAlert('Failed to play track', 'error');
      }
    }

    function updateActiveTrack() {
      document.querySelectorAll('.track-list li').forEach(li => {
        li.classList.toggle('active', parseInt(li.getAttribute('data-song-id')) === currentSongId);
      });
    }

    // ============================================
    // LOCAL FILE UPLOAD
    // ============================================
    audioUpload.addEventListener('change', async (e) => {
      try {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        for (const file of files) {
          // Validate audio MIME type
          if (!file.type.startsWith('audio/')) {
            showAlert(`Skipped "${file.name}" - not an audio file`, 'error');
            continue;
          }
          await db.songs.add({ name: file.name, blob: file });
        }

        showAlert(`Added ${files.length} track(s)`, 'success');
        audioUpload.value = ''; // Reset input
        loadPlaylist();
      } catch (error) {
        console.error('File upload error:', error);
        showAlert('Failed to upload files', 'error');
      }
    });

    // ============================================
    // GOOGLE DRIVE INTEGRATION
    // ============================================
    async function initGoogleAuth() {
      try {
        // Validate Client ID is configured
        if (CLIENT_ID.includes('YOUR_CLIENT_ID')) {
          driveAuthBtn.disabled = true;
          driveAuthBtn.title = 'Configure CLIENT_ID in index.html first';
          return;
        }

        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: handleAuthCallback,
        });

        driveAuthBtn.addEventListener('click', () => {
          tokenClient.requestAccessToken({ prompt: 'consent' });
        });
      } catch (error) {
        console.error('Google Auth initialization failed:', error);
        showAlert('Google Drive integration unavailable', 'error');
      }
    }

    async function handleAuthCallback(response) {
      try {
        if (response.error !== undefined) {
          throw new Error(`Auth error: ${response.error}`);
        }

        accessToken = response.access_token;
        driveAuthBtn.classList.add('connected');
        driveAuthBtn.innerText = '✅ Drive Connected';
        showAlert('Google Drive connected successfully', 'success');
        
        await fetchAudioFromDrive();
      } catch (error) {
        console.error('Auth callback error:', error);
        showAlert('Failed to connect Google Drive', 'error');
        driveAuthBtn.innerText = '☁️ Sync Google Drive';
      }
    }

    async function fetchAudioFromDrive() {
      try {
        if (!accessToken) {
          throw new Error('No access token');
        }

        artistInfo.innerText = 'Scanning Google Drive...';
        
        const query = "mimeType contains 'audio/' and trashed = false";
        const params = new URLSearchParams({
          q: query,
          fields: 'files(id, name, mimeType)',
          pageSize: 50
        });

        const response = await fetch(
          `https://www.googleapis.com/drive/v3/files?${params}`,
          {
            headers: { 'Authorization': `Bearer ${accessToken}` }
          }
        );

        if (!response.ok) {
          throw new Error(`Drive API error: ${response.status}`);
        }

        const data = await response.json();

        if (!data.files || data.files.length === 0) {
          showAlert('No audio files found in Google Drive', 'error');
          artistInfo.innerText = 'Upload music to get started';
          return;
        }

        let addedCount = 0;
        for (const file of data.files) {
          const existing = await db.songs.where('driveId').equals(file.id).first();
          if (!existing) {
            await db.songs.add({
              name: file.name,
              driveId: file.id,
              blob: null // Will download and cache when clicked
            });
            addedCount++;
          }
        }

        if (addedCount > 0) {
          showAlert(`Added ${addedCount} track(s) from Google Drive`, 'success');
        } else {
          showAlert(`All ${data.files.length} Drive tracks already in library`, 'success');
        }

        artistInfo.innerText = 'Upload music to get started';
        loadPlaylist();
      } catch (error) {
        console.error('Google Drive fetch error:', error);
        showAlert('Failed to sync Google Drive', 'error');
        artistInfo.innerText = 'Upload music to get started';
      }
    }

    async function fetchDriveAudioBlob(fileId) {
      try {
        const response = await fetch(
          `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
          {
            headers: { 'Authorization': `Bearer ${accessToken}` }
          }
        );

        if (!response.ok) {
          throw new Error(`Failed to fetch audio: ${response.status}`);
        }

        return await response.blob();
      } catch (error) {
        console.error('Drive blob fetch error:', error);
        throw error;
      }
    }

    // ============================================
    // MOOD SYSTEM
    // ============================================
    const moods = {
      chill: 'linear-gradient(135deg, #2b5876, #4e4376)',
      energetic: 'linear-gradient(135deg, #ff416c, #ff4b2b)',
      focus: 'linear-gradient(135deg, #0f2027, #203a43, #2c5364)'
    };

    function setMood(moodKey) {
      if (moods[moodKey]) {
        document.documentElement.style.setProperty('--bg-gradient', moods[moodKey]);
      }
    }

    // ============================================
    // PWA SERVICE WORKER
    // ============================================
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.warn('Service Worker registration failed:', err);
      });
    }

    // ============================================
    // INITIALIZATION
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      loadPlaylist();
      initGoogleAuth();
    });
  </script>
</body>
</html>
